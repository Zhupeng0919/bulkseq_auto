# ============================================================
# 参考基因组下载源配置
# ============================================================
# 用法:
#   bash scripts/build_reference.sh <species_key>
#
# 每个物种包含:
#   genome_name — 基因组版本名
#   fasta_url   — NCBI 基因组 FASTA 下载地址
#   gtf_url     — NCBI 基因注释 GTF 下载地址
#   output_dir  — 参考文件根目录，产物布局:
#       {output_dir}/                           — FASTA、GTF 等原始文件
#       {output_dir}_His2_refrence/             — HISAT2 索引 + exons.txt + splice_sites.txt
# ============================================================

reference_root: "/home/zhuzp/reference"

human:
  genome_name: "GRCh38.p14"
  fasta_url: "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.40_GRCh38.p14/GCF_000001405.40_GRCh38.p14_genomic.fna.gz"
  gtf_url: "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.40_GRCh38.p14/GCF_000001405.40_GRCh38.p14_genomic.gtf.gz"
  output_dir: "/home/zhuzp/reference/GRCh38.p14"

mouse:
  genome_name: "GRCm39"
  fasta_url: "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/635/GCF_000001635.27_GRCm39/GCF_000001635.27_GRCm39_genomic.fna.gz"
  gtf_url: "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/635/GCF_000001635.27_GRCm39/GCF_000001635.27_GRCm39_genomic.gtf.gz"
  output_dir: "/home/zhuzp/reference/GRCm39"

rat:
  genome_name: "GRCr8"
  fasta_url: "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/036/323/735/GCF_036323735.1_GRCr8/GCF_036323735.1_GRCr8_genomic.fna.gz"
  gtf_url: "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/036/323/735/GCF_036323735.1_GRCr8/GCF_036323735.1_GRCr8_genomic.gtf.gz"
  output_dir: "/home/zhuzp/reference/GRCr8"
