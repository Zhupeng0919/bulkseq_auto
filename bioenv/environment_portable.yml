name: bioinfo_env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Core
  - python>=3.12
  - snakemake>=9

  # R base and reporting
  - r-base>=4.5
  - r-rmarkdown
  - r-knitr
  - r-tinytex

  # DESeq2 and enrichment
  - bioconductor-deseq2
  - bioconductor-clusterprofiler
  - bioconductor-enrichplot
  - bioconductor-msigdbr
  - bioconductor-limma

  # Annotation databases
  - bioconductor-org.hs.eg.db
  - bioconductor-org.mm.eg.db

  # Data manipulation and plotting
  - r-ggplot2
  - r-ggrepel
  - r-pheatmap
  - r-dplyr
  - r-tidyr
  - r-readr

  # RNA-seq upstream tools (mode=fastq)
  - fastp
  - fastqc
  - multiqc
  - hisat2
  - subread
  - samtools
  - cutadapt
  - trim-galore
